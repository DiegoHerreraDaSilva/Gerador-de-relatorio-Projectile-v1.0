[pytest]
; Descoberta de teste fica em backend/tests/. `pythonpath = ..` adiciona a
; raiz do repo (um nível acima deste arquivo, que fica em backend/) ao
; sys.path, para que os testes possam `from backend.app.X import Y` — os
; mesmos imports relativos (`from .parser import ...`) usados em produção só
; funcionam quando o pacote é importado como `backend.app.*`, nunca como
; `app.*` (ver CLAUDE.md, seção "Python imports").
testpaths = tests
pythonpath = ..

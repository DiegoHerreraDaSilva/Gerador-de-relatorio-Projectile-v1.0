name: CI

# Roda testes (backend + frontend) em todo push e em todo PR pra main.
# Sem deploy automático: a conexão SSH direto entre o servidor e o GitHub foi
# considerada insegura demais pra esse projeto — atualizar o servidor
# continua sendo manual (ver README "Build & Run").
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Instalar dependências
        run: pip install -r backend/requirements-dev.txt

      - name: Rodar pytest
        run: python -m pytest backend/tests/ -v

  frontend-build:
    name: Frontend (vitest + typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        working-directory: frontend
        run: npm ci

      - name: Rodar testes (vitest)
        working-directory: frontend
        run: npm run test

      - name: Build (tsc -b && vite build)
        working-directory: frontend
        run: npm run build

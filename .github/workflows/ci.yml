name: CI

# Roda testes (backend + frontend) em todo push e em todo PR pra main.
# Sem deploy automático: a conexão SSH direto entre o servidor e o GitHub foi
# considerada insegura demais pra esse projeto — atualizar o servidor
# continua sendo manual (ver README "Build & Run").
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    # reports-mysql pros testes marcados @pytest.mark.reports_db (persistência
    # em reports_db) — mesmo mecanismo de auto-criação de schema/usuário do
    # docker-compose.yml local, sem precisar de credencial root aqui.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "no"
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_DATABASE: reports_db_test
          MYSQL_USER: reports_app
          MYSQL_PASSWORD: ci_reports_app_password
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      REPORTS_DB_HOST: 127.0.0.1
      REPORTS_DB_PORT: 3307
      REPORTS_DB_USER: reports_app
      REPORTS_DB_NAME: reports_db_test
      REPORTS_DB_TEST_PASSWORD: ci_reports_app_password
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Instalar dependências
        run: pip install -r backend/requirements-dev.txt

      - name: Aplicar migrations do reports_db (schema de teste)
        run: alembic upgrade head

      - name: Rodar pytest
        run: python -m pytest backend/tests/ -v

  frontend-build:
    name: Frontend (vitest + typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        working-directory: frontend
        run: npm ci

      - name: Rodar testes (vitest)
        working-directory: frontend
        run: npm run test

      - name: Build (tsc -b && vite build)
        working-directory: frontend
        run: npm run build
